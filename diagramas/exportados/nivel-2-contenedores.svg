<text x="670.0" y="974" font-size="14" fill="#e4edf8" text-anchor="middle">[Sistema externo]</text>
<text x="670.0" y="1000" font-size="15" fill="#fff" text-anchor="middle">Productos, existencias, precios</text>
<text x="670.0" y="1020" font-size="15" fill="#fff" text-anchor="middle">y ventas (solo lectura)</text>
