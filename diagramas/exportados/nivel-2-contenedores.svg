<text x="760" y="1173" font-size="14" fill="#333" text-anchor="start">Flecha continua: flujo en línea (1 a 5 = recorrido de una consulta; 5 es la respuesta).</text>
<text x="760" y="1203" font-size="14" fill="#333" text-anchor="start">Flecha punteada: flujo manual fuera de línea (A: exportar correcciones, B: publicar modelo).</text>
<text x="760" y="1233" font-size="14" fill="#333" text-anchor="start">La dirección de la flecha indica quién inicia la comunicación (la respuesta 5 viaja por la conexión del paso 1).</text>
<text x="760" y="1263" font-size="14" font-weight="bold" fill="#333" text-anchor="start">Los flujos en línea (1 a 5) no salen de la red local. Solo A y B cruzan la frontera, y son copias manuales de archivos.</text>
